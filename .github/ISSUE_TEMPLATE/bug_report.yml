name: Bug report
description: Report a problem with QCY H3 Control
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: "e.g. Fedora 41, Ubuntu 24.04, CachyOS"
    validations:
      required: true
  - type: input
    id: gnome
    attributes:
      label: GNOME Shell version
      placeholder: "e.g. 51.1"
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.4"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Output of `journalctl --user -u qcy-h3-control.service -f` and any relevant terminal output."
      render: shell
    validations:
      required: false
