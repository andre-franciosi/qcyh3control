[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcy-h3-control"
version = "0.1.0"
description = "Self-contained GNOME Shell 51 extension to control the QCY H3 over BLE/JieLi RCSP, plus an optional Python diagnostic app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "André Franciosi" }]
keywords = ["qcy", "qcy-h3", "bluetooth", "ble", "anc", "equalizer", "gnome", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]
dependencies = ["bleak>=0.22,<2", "dbus-fast>=2"]

[project.urls]
Homepage = "https://github.com/andre-franciosi/qcyh3control"
Repository = "https://github.com/andre-franciosi/qcyh3control"
Issues = "https://github.com/andre-franciosi/qcyh3control/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qcy-h3-control = "qcyh3control.main:main"
qcy-h3-control-daemon = "qcyh3control.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qcyh3control = ["profile.example.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
